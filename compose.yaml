services:
  db:
    image: postgres:16
    container_name: eventhub-db
    environment:
      POSTGRES_DB: eventhub_db
      POSTGRES_USER: eventhub_user
      POSTGRES_PASSWORD: eventhub_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventhub_user -d eventhub_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: eventhub-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://eventhub_user:eventhub_password@db:5432/eventhub_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
